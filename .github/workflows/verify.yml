name: Verify runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared modules
        run: |
          find docs ai scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check worker.mjs
          node --check worker-v3.mjs
      - name: Test without installing packages
        run: node --test tests/*.test.mjs
